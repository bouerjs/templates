<!DOCTYPE html>
<html lang="en" class="light-mode">

<head>
    <title>Redirecting...</title>
</head>

<body>
    <script>
        var redirectingTo = window.location.href;
        // This stores the route the user was navigating to
        localStorage.setItem('redirect', redirectingTo);
        // Redirecting to the main page
        window.location.href = '../';
    </script>
</body>

</html>
